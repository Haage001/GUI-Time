// build.gradle
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()                                // Maven Central
	maven { url "https://maven.fabricmc.net/" }   // Fabric’s Maven
	maven { url "https://maven.shedaniel.me/" }   // Cloth Config
	maven { url "https://maven.terraformersmc.com/releases/" } // ModMenu
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// Minecraft, loader, core Fabric API
	minecraft        "com.mojang:minecraft:${project.minecraft_version}"
	implementation    "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation    "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth Config (optional - used at compile time only, not bundled)
	compileOnly("me.shedaniel.cloth:cloth-config-fabric:26.1.154") {
		exclude group: "net.fabricmc.fabric-api"
	}

	// ModMenu (optional - used at compile time only, not bundled)
	compileOnly "com.terraformersmc:modmenu:18.0.0-alpha.8"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
